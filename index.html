<style>
@property --amb1{syntax:'<color>';inherits:true;initial-value:#4f5bd5}

  --gl:max(16px,var(--sal)); --gr:max(16px,var(--sar));

}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){

  --glass-a:rgba(255,255,255,.8); --glass-b:rgba(255,255,255,.45); --glass-line:rgba(255,255,255,.95); --glass-hi:rgba(255,255,255,1);
  --hair:rgba(16,18,24,.09); --shadow:rgba(30,40,80,.2); --track:rgba(16,18,24,.18); --bar:rgba(16,18,24,.22);
  --accent:#101218; --on-accent:#fff; --chip-on:#101218; --chip-on-fg:#fff;
  --sheet:rgba(232,232,238,.68); --sov:linear-gradient(rgba(255,255,255,.34),rgba(255,255,255,.58)); --amb-mix:40%; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#e8e8ee; --fg:#101218; --muted:rgba(16,18,24,.66); --faint:rgba(16,18,24,.44);

  --hair:rgba(16,18,24,.09); --shadow:rgba(30,40,80,.2); --track:rgba(16,18,24,.18); --bar:rgba(16,18,24,.22);
  --accent:#101218; --on-accent:#fff; --chip-on:#101218; --chip-on-fg:#fff;

*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font:400 15px/1.35 var(--f-body);overflow:hidden;

}

.i.f{fill:currentColor;stroke:none}

.amb{position:fixed;inset:-10%;z-index:0;pointer-events:none;background:
  radial-gradient(85% 60% at 10% -10%,color-mix(in srgb,var(--amb1) var(--amb-mix),transparent),transparent 80%),
  radial-gradient(75% 60% at 95% 30%,color-mix(in srgb,var(--amb2) calc(var(--amb-mix) - 10%),transparent),transparent 80%),

}
#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto}

.glass{
  background:linear-gradient(135deg,var(--glass-a),var(--glass-b));
  -webkit-backdrop-filter:blur(32px) saturate(210%);
  backdrop-filter:blur(32px) saturate(210%);
  border:1px solid var(--glass-line);
  box-shadow:inset 0 1.5px 0 var(--glass-hi),0 16px 36px -12px var(--shadow);
}

.eyebrow{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font:700 34px/1.02 var(--f-display);letter-spacing:-.025em;text-wrap:balance}

.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}

.s44{width:44px;border-radius:10px}.s48{width:48px}.s56{width:56px}.s72{width:72px;border-radius:14px}.s138{width:138px;border-radius:16px}.sfull{width:100%}

.note{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:18px;margin-bottom:14px;font-size:13.5px;color:var(--muted)}

.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:4px;scrollbar-width:none}

.ct{width:138px;flex:none;scroll-snap-align:start;min-width:0}

.list{border-radius:22px;overflow:hidden}

.seg{display:inline-grid;grid-auto-flow:column;padding:3px;border-radius:999px;margin-bottom:14px}

.chips{display:flex;gap:8px;overflow-x:auto;margin:12px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border:1px solid var(--glass-line);background:linear-gradient(135deg,var(--glass-a),var(--glass-b))}

.search{display:flex;align-items:center;gap:8px;border-radius:999px;padding:0 16px;height:46px;color:var(--muted)}

.search input::placeholder{color:var(--faint)}
.acts{display:flex;gap:10px;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 20px;border-radius:999px;font-weight:650;flex:1;text-align:center}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn .i{width:18px;height:18px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;margin-bottom:12px}
.back .i{width:20px;height:20px}
.fhead{display:flex;gap:16px;align-items:center;margin-bottom:16px}
.fhead .meta h1{font-size:26px}

.dock{position:absolute;left:var(--gl);right:var(--gr);bottom:calc(10px + var(--sab));display:flex;flex-direction:column;gap:8px;z-index:5;pointer-events:none}
.dock>*{pointer-events:auto}
.mini{display:flex;align-items:center;gap:10px;padding:8px 10px 12px 8px;border-radius:22px;position:relative;overflow:hidden;cursor:pointer}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex:none}
.mp{position:absolute;left:12px;right:12px;bottom:5px;height:2px;border-radius:2px;background:var(--track)}
.mp i{display:block;height:100%;width:0;background:var(--fg);border-radius:2px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border-radius:26px;gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 6px;border-radius:20px;font-size:10.5px;font-weight:600;color:var(--muted);text-align:center}
.tab.on{background:linear-gradient(135deg,var(--glass-a),var(--glass-b));color:var(--accent);box-shadow:inset 0 1px 0 var(--glass-hi)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(176px + var(--sab));padding:10px 16px;border-radius:999px;font-weight:600;font-size:13.5px;z-index:40;max-width:92%;text-align:center}

.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;gap:14px;overflow:hidden;
  padding:calc(8px + var(--sat)) max(20px,var(--sar),calc((100vw - 480px)/2)) calc(18px + var(--sab)) max(20px,var(--sal),calc((100vw - 480px)/2));
  background:var(--bg);transform:translateY(105%);visibility:hidden;transition:transform .42s cubic-bezier(.32,.72,0,1),visibility 0s .42s}
.sheet.open{transform:none;visibility:visible;transition:transform .42s cubic-bezier(.32,.72,0,1),visibility 0s}
.sheet>*{position:relative;z-index:1}
.sheet>.sh-bg{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sh-bg .l{position:absolute;inset:-14%;background-size:cover;background-position:center;filter:blur(52px) saturate(1.8);opacity:0;transition:opacity .9s ease}
.sh-bg .l.in{opacity:1}
.sh-bg::after{content:"";position:absolute;inset:0;background:var(--sov)}
.sh-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.sh-top>:first-child{justify-self:start}
.sh-top .rb{display:flex;gap:8px;justify-self:end}
.round.on{background:var(--accent);color:var(--on-accent);border-color:transparent}
.sh-top .mid{text-align:center;min-width:0}

.sh-art{margin:auto;width:clamp(190px,calc(100dvh - 470px - var(--sat) - var(--sab)),100%);aspect-ratio:1;border-radius:28px;box-shadow:0 30px 60px -20px rgba(0,0,0,.65);transform:scale(.86);transition:transform .5s cubic-bezier(.32,.72,0,1)}

.seek{width:100%;-webkit-appearance:none;appearance:none;background:transparent;height:28px;margin:0;--p:0%}

.ctl .ib .one{position:absolute;font-size:10px;font-weight:700;top:12px;right:12px}
.playbtn{width:76px;height:76px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:0 14px 30px -10px var(--shadow)}
.playbtn .i{width:32px;height:32px}
.sh-next{margin:0;text-align:center;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.scanm{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:calc(20px + var(--sat)) max(16px,var(--sar)) calc(20px + var(--sab)) max(16px,var(--sal));background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sm{width:100%;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:12px;background:linear-gradient(135deg,var(--glass-a),var(--glass-b)),var(--bg)}

.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.tcustom{display:flex;gap:8px}

.picks{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}

.pick .art::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.68),rgba(0,0,0,0) 58%)}
.pick .art b{position:absolute;z-index:1;left:16px;right:64px;bottom:34px;color:#fff;font:700 25px/1.04 var(--f-display);letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 12px rgba(0,0,0,.35)}

</style>
